<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>I Love Sayang</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Quicksand:wght@300;500&display=swap');

        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: radial-gradient(circle, #fff5f5 0%, #fed7e2 100%);
            font-family: 'Quicksand', sans-serif;
        }

        #canvas {
            position: fixed;
            top: 0;
            left: 0;
            z-index: 0;
        }

        .content {
            position: relative;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            text-align: center;
            pointer-events: none;
        }

        .heart-main {
            font-size: 100px;
            color: #ff4d6d;
            animation: pulse 1.5s ease-in-out infinite;
            filter: drop-shadow(0 0 10px rgba(255, 77, 109, 0.5));
            cursor: pointer;
            pointer-events: auto;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.15); }
        }

        .text-love {
            font-family: 'Dancing Script', cursive;
            font-size: 4rem;
            color: #ff4d6d;
            margin-top: 20px;
            opacity: 0;
            transform: translateY(20px);
            transition: all 1s ease-out;
        }

        .text-love.show {
            opacity: 1;
            transform: translateY(0);
        }

        .music-btn {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: rgba(255, 255, 255, 0.8);
            border: 2px solid #ff4d6d;
            padding: 10px 20px;
            border-radius: 50px;
            color: #ff4d6d;
            cursor: pointer;
            z-index: 100;
            transition: all 0.3s;
            font-weight: bold;
        }

        .music-btn:hover {
            background: #ff4d6d;
            color: white;
        }

        #overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.9);
            z-index: 1000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: opacity 0.5s ease-out;
        }

        /* Mobile Responsive */
        @media (max-width: 768px) {
            .heart-main {
                font-size: 60px;
            }

            .text-love {
                font-size: 2.5rem;
                margin-top: 15px;
            }

            #subText {
                font-size: 1rem;
            }

            #songCredit {
                font-size: 0.75rem;
            }

            .music-btn {
                bottom: 15px;
                right: 15px;
                padding: 8px 16px;
                font-size: 0.9rem;
            }

            #overlay h1 {
                font-size: 1.5rem;
                padding: 0 20px;
            }

            #overlay button {
                padding: 12px 24px;
                font-size: 1rem;
            }
        }

        @media (max-width: 480px) {
            .heart-main {
                font-size: 50px;
            }

            .text-love {
                font-size: 1.75rem;
            }

            #subText {
                font-size: 0.9rem;
                margin-top: 10px;
            }

            #songCredit {
                font-size: 0.65rem;
                margin-top: 5px;
            }

            .music-btn {
                bottom: 10px;
                right: 10px;
                padding: 8px 12px;
                font-size: 0.8rem;
            }
        }
    </style>
</head>
<body>

    <div id="overlay">
        <h1 class="text-3xl font-bold text-pink-600 mb-4">Siap untuk kejutan?</h1>
        <button onclick="startExperience()" class="bg-pink-500 hover:bg-pink-600 text-white px-8 py-3 rounded-full shadow-lg transition transform hover:scale-105">
            Klik di Sini ❤️
        </button>
    </div>

    <!-- Audio Element untuk Music Background -->
    <audio id="bgMusic" loop playsinline muted>
        <!-- Ganti dengan path file musik kamu -->
        <source src="vidssave.com Masa ini, Nanti, dan Masa Indah Lainnya 48KBPS.webm" type="audio/webm">
        <source src="vidssave.com Masa ini, Nanti, dan Masa Indah Lainnya 48KBPS.mp3" type="audio/mpeg">
        Your browser does not support the audio element.
    </audio>

    <canvas id="canvas"></canvas>

    <div class="content">
        <div class="heart-main" onclick="createBurst(event)">❤️</div>
        <div id="mainText" class="text-love">I Love You, Sayang</div>
        <div id="subText" class="text-pink-400 mt-4 text-xl italic opacity-0 transition-opacity duration-1000">Selamanya dan selalu...</div>
        <div id="songCredit" class="text-pink-300 mt-2 text-sm opacity-0 transition-opacity duration-1000">♫ Masa Ini, Nanti, dan Masa Indah Lainnya - Nuca</div>
    </div>

    <button id="musicToggle" class="music-btn" onclick="toggleMusic()">Matikan Musik</button>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const audio = document.getElementById('bgMusic');
        let hearts = [];
        let isPlaying = false;

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        class Heart {
            constructor(x, y, size, speedX, speedY, opacity) {
                this.x = x;
                this.y = y;
                this.size = size;
                this.speedX = speedX;
                this.speedY = speedY;
                this.opacity = opacity;
                this.rotation = Math.random() * Math.PI * 2;
            }

            draw() {
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate(this.rotation);
                ctx.globalAlpha = this.opacity;
                ctx.fillStyle = '#ff4d6d';
                ctx.beginPath();
                ctx.moveTo(0, 0);
                ctx.bezierCurveTo(-this.size/2, -this.size/2, -this.size, this.size/3, 0, this.size);
                ctx.bezierCurveTo(this.size, this.size/3, this.size/2, -this.size/2, 0, 0);
                ctx.fill();
                ctx.restore();
            }

            update() {
                this.x += this.speedX;
                this.y += this.speedY;
                this.opacity -= 0.005;
                this.rotation += 0.01;
            }
        }

        function addHeart() {
            const size = Math.random() * 15 + 10;
            const x = Math.random() * canvas.width;
            const y = canvas.height + size;
            const speedX = (Math.random() - 0.5) * 1;
            const speedY = - (Math.random() * 2 + 1);
            hearts.push(new Heart(x, y, size, speedX, speedY, Math.random() * 0.5 + 0.5));
        }

        function createBurst(e) {
            for(let i = 0; i < 15; i++) {
                const size = Math.random() * 10 + 5;
                const speedX = (Math.random() - 0.5) * 10;
                const speedY = (Math.random() - 0.5) * 10;
                hearts.push(new Heart(e.clientX, e.clientY, size, speedX, speedY, 1));
            }
        }

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            if (Math.random() < 0.05) addHeart();
            hearts = hearts.filter(h => h.opacity > 0);
            hearts.forEach(h => {
                h.update();
                h.draw();
            });
            requestAnimationFrame(animate);
        }

        function toggleMusic() {
            const btn = document.getElementById('musicToggle');
            if(isPlaying) {
                audio.pause();
                isPlaying = false;
                btn.innerText = "Nyalakan Musik ♪";
            } else {
                audio.muted = false;
                const playPromise = audio.play();
                if (playPromise !== undefined) {
                    playPromise.then(() => {
                        isPlaying = true;
                        btn.innerText = "Matikan Musik ♫";
                    }).catch(error => {
                        console.log("Musik tidak dapat diputar: ", error);
                        alert("Musik tidak dapat diputar di perangkat ini");
                    });
                }
            }
        }

        function startExperience() {
            document.getElementById('overlay').style.opacity = '0';
            
            // Unmute dan mulai pemutaran audio
            audio.muted = false;
            const playPromise = audio.play();
            
            if (playPromise !== undefined) {
                playPromise.then(() => {
                    isPlaying = true;
                    document.getElementById('musicToggle').innerText = "Matikan Musik ♫";
                }).catch(e => {
                    console.log("Autoplay dicegah (normal di mobile): ", e);
                    // Tetap lanjut pengalaman meski musik tidak bisa autoplay
                    document.getElementById('musicToggle').innerText = "Nyalakan Musik ♪";
                });
            }

            setTimeout(() => {
                document.getElementById('overlay').style.display = 'none';
                document.getElementById('mainText').classList.add('show');
                setTimeout(() => {
                    document.getElementById('subText').style.opacity = '1';
                    document.getElementById('songCredit').style.opacity = '0.7';
                }, 2000);
                animate();
            }, 500);
        }
    </script>
</body>
</html>
